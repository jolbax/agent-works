name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate OpenSpec changes and specs
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict
      # The lock is read from the BASE branch, so a PR cannot weaken the rule
      # it is checked against. Agents' token cannot edit workflows at all.
      - name: Spec lock
        if: github.event_name == 'pull_request'
        # checkout gives refs/pull/N/merge: first parent = current base tip,
        # second = PR head. pull_request.base.sha can be stale when the base
        # moved while the PR was open, which made the lock see the base's own
        # changes as part of the PR (seen on #22).
        run: |
          BASE=$(git rev-parse HEAD^1)
          export BASE
          if git cat-file -e "$BASE:scripts/spec-lock.sh" 2>/dev/null; then
            git show "$BASE:scripts/spec-lock.sh" > "$RUNNER_TEMP/spec-lock.sh"
          else
            echo "spec-lock: not on the base branch yet (bootstrap PR); using this PR's copy"
            cp scripts/spec-lock.sh "$RUNNER_TEMP/spec-lock.sh"
          fi
          bash "$RUNNER_TEMP/spec-lock.sh"
